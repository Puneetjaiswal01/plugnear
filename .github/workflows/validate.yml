name: Validate PlugNear
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Public test fixtures, intentionally invalid against the real service.
      # All browser backend requests are denied unless a test mocks them.
      EXPO_PUBLIC_SUPABASE_URL: https://yxisoddhwlzetrnfbbno.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_not_a_real_key
      VITE_SUPABASE_URL: https://yxisoddhwlzetrnfbbno.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_not_a_real_key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:website
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
